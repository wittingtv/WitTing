<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Djezzy Clone - Working Version</title>
    
    <!-- ربط ملف الـ CSS تاعنا -->
    <link rel="stylesheet" href="style.css">
    
    <!-- ربط مكتبة Swiper (باش يخدم السلايدر) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
</head>
<body>

    <!-- القائمة العلوية -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">Djezzy</div>
            <ul class="nav-links">
                <li><a href="#">Offres</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Mobiles</a></li>
                <li><a href="#">Mon espace</a></li>
            </ul>
        </div>
    </nav>

    <!-- السلايدر (Swiper) -->
    <div class="swiper mySwiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <img src="https://www.djezzy.dz/wp-content/uploads/2026/10/china-1920-x-1080-pix-5.png" alt="Slide 1">
            </div>
            <div class="swiper-slide">
                <img src="https://www.djezzy.dz/wp-content/uploads/2026/07/slider-roaming-b2c.png" alt="Slide 2">
            </div>
            <div class="swiper-slide">
                <img src="https://www.djezzy.dz/wp-content/uploads/2026/06/web-rubrique-b2c-home-page.jpg" alt="Slide 3">
            </div>
        </div>
        <div class="swiper-pagination"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>

    <!-- قسم الخدمات -->
    <section class="services container">
        <h2 class="section-title">NOS SERVICES</h2>
        <div class="services-grid">
            <div class="service-card">
                <div class="icon">📞</div>
                <h3>VoLTE</h3>
            </div>
            <div class="service-card">
                <div class="icon">🎬</div>
                <h3>TOD</h3>
            </div>
            <div class="service-card">
                <div class="icon">📚</div>
                <h3>Dorouscom</h3>
            </div>
            <div class="service-card">
                <div class="icon">🎮</div>
                <h3>Digital Fennec</h3>
            </div>
        </div>
        <div class="btn-container">
            <button class="btn-primary" onclick="showAlert()">Tous les services Djezzy</button>
        </div>
    </section>

    <!-- ربط ملف الـ JS تاعنا -->
    <script src="script.js"></script>
    
    <!-- ربط مكتبة Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    
    <!-- تفعيل السلايدر -->
    <script>
        var swiper = new Swiper(".mySwiper", {
            pagination: { el: ".swiper-pagination", clickable: true },
            navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" },
            autoplay: { delay: 3000, disableOnInteraction: false },
            loop: true
        });
    </script>
</body>
</html>
